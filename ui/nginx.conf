# Template — nginx image chính thức tự envsubst các biến ${...} trong
# /etc/nginx/templates/*.template thành /etc/nginx/conf.d/*.conf lúc container
# start (không cần custom entrypoint script). Xem docker-compose.yml — biến
# API_UPSTREAM trỏ sang service backend trong cùng docker network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # UI gọi fetch('/api/...') — proxy cùng-origin sang Backend Server, tránh
    # phải cấu hình CORS/BACKEND_URL riêng cho từng môi trường.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
